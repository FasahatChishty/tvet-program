<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Assessment Type</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body{background:linear-gradient(180deg,#f8fafc 0%,#eef4ff 100%);color:#0f172a;}
.wrap{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:min(100%,640px);background:#fff;border-radius:28px;padding:34px 28px;box-shadow:0 20px 60px rgba(15,23,42,.12);text-align:center;}
.card h1{margin:0 0 12px;font-size:clamp(1.8rem,4vw,2.6rem);}
.card p{margin:0 0 26px;color:#64748b;line-height:1.6;}
.actions{display:grid;grid-template-columns:1fr;gap:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 20px;border-radius:16px;text-decoration:none;font-weight:800;border:0;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(15,23,42,.12);}
.fyp{background:linear-gradient(90deg,#111827 0%,#334155 100%);color:#fff;}
.job{background:#e2e8f0;color:#0f172a;}
@media (min-width:720px){.actions{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header class="main-header">
    <div class="logo">TVET Program</div>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>
<main class="wrap">
    <section class="card">
        <h1>Choose Assessment Type</h1>
        <p>Select the assessment you want to take next.</p>
        <form method="POST" action="{{ url_for('select_test') }}">
            <div class="actions">
                <button class="btn fyp" type="submit" name="test_type" value="FYP">FYP Assessment</button>
                <button class="btn job" type="submit" name="test_type" value="JOB">Job Assessment</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
