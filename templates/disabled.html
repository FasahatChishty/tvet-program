<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Disabled</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body{background:linear-gradient(180deg,#f8fafc 0%,#eef4ff 100%);color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.box{max-width:640px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(15,23,42,.10);text-align:center;}
.box h1{margin:0 0 12px;color:#0f172a;}
.box p{color:#475569;line-height:1.7;margin:0 0 24px;}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 18px;font-weight:800;text-decoration:none;background:linear-gradient(90deg,#111827 0%,#334155 100%);color:#fff;}
</style>
</head>
<body>
  <div class="box">
    <h1>Assessment Unavailable</h1>
    <p>{{ message }}</p>
    <a class="btn" href="{{ url_for('select_test') }}">Back to Selection</a>
  </div>
</body>
</html>
