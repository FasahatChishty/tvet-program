<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Settings</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body{background:linear-gradient(180deg,#f8fafc 0%,#eef4ff 100%);color:#0f172a;}
.main-header{background:#0f172a;color:#fff;box-shadow:0 10px 24px rgba(15,23,42,.18);}
.main-header .logo,.main-header a{color:#fff;}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px;color:#0f172a;}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px;box-shadow:0 12px 30px rgba(15,23,42,.08);}
.panel h1{margin:0 0 18px;color:#0f172a;}
.field{margin-bottom:18px;}
.field label{display:flex;align-items:center;gap:10px;font-weight:700;color:#0f172a;}
.field input[type="number"]{width:100%;margin-top:8px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:12px;font-size:1rem;color:#0f172a;background:#fff;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 18px;font-weight:800;text-decoration:none;cursor:pointer;}
.btn-primary{background:linear-gradient(90deg,#111827 0%,#334155 100%);color:#fff;}
.btn-secondary{background:#e2e8f0;color:#0f172a;}
.hint{color:#64748b;margin-top:6px;font-size:.95rem;}
</style>
</head>
<body>
<header class="main-header">
  <div class="logo">TVET Admin</div>
  <nav>
    <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin_users') }}">Users</a>
    <a href="{{ url_for('admin_results') }}">Results</a>
    <a href="{{ url_for('admin_questions') }}">Questions</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
</header>
<main class="wrap">
  <div class="panel">
    <h1>Assessment Settings</h1>
    <form method="POST" action="{{ url_for('admin_settings') }}">
      <div class="field">
        <label><input type="checkbox" name="FYP_enabled" {% if settings.get('FYP_enabled', True) %}checked{% endif %}> FYP Assessment Enabled</label>
      </div>
      <div class="field">
        <label><input type="checkbox" name="JOB_enabled" {% if settings.get('JOB_enabled', True) %}checked{% endif %}> Job Assessment Enabled</label>
      </div>
      <div class="field">
        <label for="time_per_question">Time per question (seconds)</label>
        <input id="time_per_question" name="time_per_question" type="number" min="10" step="1" value="{{ settings.get('time_per_question', 60) }}">
        <div class="hint">The timer on the test page will use this value for each question.</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Save Settings</button>
        <a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
